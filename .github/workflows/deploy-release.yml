name: 🚀 Deploy cloud-mail (release overlay)

# Overlay workflow for the `release` branch (see doc/release-overlay.md).
# The `release` branch is always `main` (pure upstream) + the overlay commits.
# Upstream's own deploy-cloudflare.yml is disabled on this repo: its init step is
# challenged by Cloudflare for GitHub runner IPs before reaching the Worker.
on:
  push:
    branches: [ release ]
  workflow_dispatch:

jobs:
  Deploy-cloud-mail:
    name: 🏗️ Build and Deploy
    runs-on: ubuntu-latest
    # Serialize releases: two deployments must never overlap, and a queued run must
    # not be cancelled (an interrupted deploy could leave the init bridge behind).
    concurrency:
      group: deploy-cloud-mail-release
      cancel-in-progress: false

    env:
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN || vars.CUSTOM_DOMAIN }}
      DOMAIN: ${{ secrets.DOMAIN || vars.DOMAIN }}
      ADMIN: ${{ secrets.ADMIN || vars.ADMIN }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || vars.JWT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
      PROJECT_LINK: ${{ secrets.PROJECT_LINK || vars.PROJECT_LINK }}
      AI_MODEL: ${{ secrets.AI_MODEL || vars.AI_MODEL || '@cf/meta/llama-3.1-8b-instruct-fast' }}
      EMAIL: ${{ secrets.EMAIL || vars.EMAIL }}
      ANALYSIS_CACHE: ${{ secrets.ANALYSIS_CACHE || vars.ANALYSIS_CACHE || false }}


    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}


    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙ Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 11

      - name: ⚙ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "./mail-worker/pnpm-lock.yaml"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-worker

      - name: 📡 Disable wrangler telemetry
        working-directory: ./mail-worker
        run: pnpm wrangler telemetry disable

      - name: 🛠️ Set up environment
        working-directory: ./mail-worker
        run: |
          
          echo "🔐 Starting environment setup..."
          
          if [ -z "$JWT_SECRET" ] || grep -q '[?%#/\\]' <<< "$JWT_SECRET"; then
            echo "❌ JWT_SECRET variable is empty or contains invalid characters (?, %, #, /, \\)."
            exit 1
          fi
          
          if ! jq -e 'type == "array"' <<< "$DOMAIN" ; then
            echo "❌ DOMAIN variable must be a JSON array (e.g., [\"example.com\"])."
            exit 1
          fi
          
          if [ -z "$ADMIN" ]; then
            echo "❌ ADMIN variable cannot be empty."
            exit 1
          fi
          
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ CLOUDFLARE_ACCOUNT_ID variable cannot be empty."
            exit 1
          fi
          
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN variable cannot be empty."
            exit 1
          fi
          
          if [ -z "$CUSTOM_DOMAIN" ]; then
            echo "::warning:: CUSTOM_DOMAIN variable is not set."
          fi
          
          CONFIG_FILE="wrangler-action.toml"
          
          if [ -z "$R2_BUCKET_NAME" ]; then
            sed -i '/\[\[r2_buckets\]\]/,/^$/d' "$CONFIG_FILE"
          fi
          
          if [ -z "$PROJECT_LINK" ]; then
            sed -i '/^project_link = /d' "$CONFIG_FILE"
          fi
          
          if [ -z "$CUSTOM_DOMAIN" ]; then
            sed -i '/\[\[routes\]\]/,/^$/d' "$CONFIG_FILE"
          fi
          
          if [ -n "$EMAIL" ]; then
            cat >> "$CONFIG_FILE" <<'EOF'

          [[send_email]]
          name = "email"
          EOF
          fi

          sed -i "s|\${NAME}|${NAME}|g" "$CONFIG_FILE"
          sed -i "s|\${CUSTOM_DOMAIN}|${CUSTOM_DOMAIN}|g" "$CONFIG_FILE"
          sed -i "s|\"\${DOMAIN}\"|${DOMAIN}|g" "$CONFIG_FILE"
          sed -i "s|\${ADMIN}|${ADMIN}|g" "$CONFIG_FILE"
          sed -i "s|\${JWT_SECRET}|${JWT_SECRET}|g" "$CONFIG_FILE"
          sed -i "s|\${R2_BUCKET_NAME}|${R2_BUCKET_NAME}|g" "$CONFIG_FILE"
          sed -i "s|\${PROJECT_LINK}|${PROJECT_LINK}|g" "$CONFIG_FILE"
          sed -i "s|\${ANALYSIS_CACHE}|${ANALYSIS_CACHE}|g" "$CONFIG_FILE"
          sed -i "s|\${AI_MODEL}|${AI_MODEL}|g" "$CONFIG_FILE"
          sed -i "s|\${LINUXDO_CLIENT_ID}|${LINUXDO_CLIENT_ID}|g" "$CONFIG_FILE"
          sed -i "s|\${LINUXDO_CLIENT_SECRET}|${LINUXDO_CLIENT_SECRET}|g" "$CONFIG_FILE"
          sed -i "s|\${LINUXDO_CALLBACK_URL}|${LINUXDO_CALLBACK_URL}|g" "$CONFIG_FILE"
          
          echo "✅ Environment setup completed."

      - name: ⚡ Set up KV database
        working-directory: ./mail-worker
        run: |
          
          CONFIG_FILE="wrangler-action.toml"
          
          if [ -n "$KV_NAMESPACE_ID" ]; then
            sed -i "s|\${KV_NAMESPACE_ID}|${KV_NAMESPACE_ID}|g" "$CONFIG_FILE"
            echo "✅ Using the database from environment variables."
            exit 0
          fi
          
          echo "🔍 Checking if the database exists..."
          
          set +e
            KV_LIST=$(pnpm wrangler kv namespace list 2>&1)
            STATUS=$?
          set -e
          
          if [ $STATUS -ne 0 ]; then
            echo "$KV_LIST"
            exit 1
          fi
                  
          if echo "$KV_LIST" | jq -e ".[] | select(.title == \"$NAME\")" >/dev/null; then
            echo "✅ Database $NAME already exists."
            KV_ID=$(echo "$KV_LIST" | jq -r ".[] | select(.title == \"$NAME\") | .id")
            echo "KV_NAMESPACE_ID: $KV_ID"
          else
            echo "⚠️ Database $NAME does not exist. Starting creation..."
            pnpm wrangler kv namespace create $NAME
            KV_LIST=$(pnpm wrangler kv namespace list)
            KV_ID=$(echo "$KV_LIST" | jq -r ".[] | select(.title == \"$NAME\") | .id")
          fi
          
          sed -i "s|\${KV_NAMESPACE_ID}|$KV_ID|g" "$CONFIG_FILE"
          echo "✅ Setup completed."

      - name: 🐬 Set up D1 database
        working-directory: ./mail-worker
        run: |
          
          CONFIG_FILE="wrangler-action.toml"
          
          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i "s|\${D1_DATABASE_ID}|${D1_DATABASE_ID}|g" "$CONFIG_FILE"
            echo "✅ Using the database from environment variables."
            exit 0
          fi
          
          echo "🔍 Checking if the database exists..."
          
          set +e
            DB_LIST=$(pnpm wrangler d1 list --json 2>&1)
            STATUS=$?
          set -e
          
          if [ $STATUS -ne 0 ]; then
            echo "$DB_LIST"
            exit 1
          fi
          
          if echo "$DB_LIST" | jq -e ".[] | select(.name == \"$NAME\")" >/dev/null; then
            echo "✅ Database $NAME already exists."
            D1_ID=$(echo "$DB_LIST" | jq -r ".[] | select(.name == \"$NAME\") | .uuid")
            echo "D1_DATABASE_ID: $D1_ID"
          else
            echo "⚠️ Database $NAME does not exist. Starting creation..."
            pnpm wrangler d1 create $NAME
            DB_LIST=$(pnpm wrangler d1 list --json)
            D1_ID=$(echo "$DB_LIST" | jq -r ".[] | select(.name == \"$NAME\") | .uuid")
          fi
          
          sed -i "s|\${D1_DATABASE_ID}|$D1_ID|g" "$CONFIG_FILE"
          echo "✅ Setup completed."

      - name: 🚀 Start deployment
        id: deploy
        working-directory: ./mail-worker
        run: |
          echo "🚀 Starting deployment..."
          pnpm wrangler deploy -c wrangler-action.toml 2>&1 \
            | tee deploy.log \
            | grep -v "https://.*\.workers\.dev" \
            | sed -E 's/env\.domain .*/env.domain (***)/' \
            || true
          
          DEPLOY_EXIT_CODE=${PIPESTATUS[0]}
          if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
            exit 1
          fi
          
          WORKER_URL=$(grep -o "https://.*\.workers\.dev" deploy.log || echo "")
          
          if [ -n "$WORKER_URL" ]; then
            echo "::add-mask::$WORKER_URL"
          fi
          
          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
          echo "✅ Setup completed."

      - name: 🔎 Overlay drift notice
        run: |
          BASE="b61ef2a7c70a6207ed2978f3b8bd346c0f712fc87f74e4946a6fae987b641cfc"
          CUR=$(sha256sum .github/workflows/deploy-cloudflare.yml | cut -d' ' -f1)
          if [ "$CUR" != "$BASE" ]; then
            echo "::warning file=.github/workflows/deploy-release.yml::upstream deploy-cloudflare.yml changed (${BASE:0:12} -> ${CUR:0:12}); review doc/release-overlay.md before the next release"
          fi

      - name: 🌉 Deploy CI init bridge
        id: bridge
        working-directory: ./mail-worker
        run: |
          echo "🌉 Deploying the one-shot init bridge..."
          sed "s|\${NAME}|${NAME}|g" wrangler-ci-init.toml > wrangler-ci-init.build.toml

          # A brand-new worker can answer 10007 on the workers.dev subdomain call right
          # after the upload; the retry finds the script already registered.
          set +e
          for attempt in 1 2 3 4; do
            pnpm wrangler deploy -c wrangler-ci-init.build.toml 2>&1 | tee bridge.log
            DEPLOY_STATUS=${PIPESTATUS[0]}
            if [ "$DEPLOY_STATUS" -eq 0 ]; then break; fi
            if ! grep -q 'code: 10007' bridge.log; then break; fi
            echo "retry $attempt: workers.dev subdomain not ready yet"
            sleep 8
          done
          set -e

          BRIDGE_URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' bridge.log | head -1)
          if [ -z "$BRIDGE_URL" ]; then
            echo "❌ Could not read the bridge workers.dev URL from wrangler output."
            exit 1
          fi

          echo "bridge_url=$BRIDGE_URL" >> "$GITHUB_OUTPUT"

      - name: 🔐 Verify init bridge guard
        working-directory: ./mail-worker
        run: |
          # Proves the bridge is only a GET transport and that the main worker still
          # enforces its own secret check. The wrong secret is random and generated
          # here; the real JWT_SECRET is never printed.
          BRIDGE_URL="${{ steps.bridge.outputs.bridge_url }}"
          BAD_SECRET="ci-guard-$(date +%s)-${RANDOM}"
          fail() { echo "❌ $1"; exit 1; }

          set +e
          CODE=$(curl -s -o guard-get.txt -w "%{http_code}" "$BRIDGE_URL/$BAD_SECRET")
          GET_STATUS=$?
          CODE_POST=$(curl -s -o guard-post.txt -w "%{http_code}" -X POST "$BRIDGE_URL/$BAD_SECRET")
          POST_STATUS=$?
          set -e

          BODY_GET=$(printf '%s' "$(cat guard-get.txt)" | head -c 200)
          BODY_POST=$(printf '%s' "$(cat guard-post.txt)" | head -c 200)
          echo "GET  wrong secret -> curl=$GET_STATUS HTTP=$CODE body=$BODY_GET"
          echo "POST wrong secret -> curl=$POST_STATUS HTTP=$CODE_POST body=$BODY_POST"

          [ "$GET_STATUS" -eq 0 ] || fail "GET request to the bridge failed (curl $GET_STATUS)"
          [ "$CODE" = "200" ] || fail "GET wrong secret returned HTTP $CODE, expected 200"
          [ "$BODY_GET" = "❌ JWT secret mismatch" ] || fail "GET wrong secret was not rejected by the main worker"

          [ "$POST_STATUS" -eq 0 ] || fail "POST request to the bridge failed (curl $POST_STATUS)"
          [ "$CODE_POST" = "405" ] || fail "POST returned HTTP $CODE_POST, expected 405 from the bridge"

          echo "✅ Bridge is GET-only and rejects an invalid secret."

      - name: ♻️ Initialize database
        run: |
          echo "🛠️ Starting database initialization..."
          sleep 10

          BRIDGE_URL="${{ steps.bridge.outputs.bridge_url }}"
          echo "init bridge: $BRIDGE_URL"

          if [ -z "$BRIDGE_URL" ]; then
            echo "❌ Init bridge URL not available."
            exit 1
          fi

          # /api/init/:secret is idempotent (IF NOT EXISTS / guarded ALTER / guarded INSERT),
          # so retrying against an already initialized database is safe.
          for attempt in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o response.txt -w "%{http_code}" "$BRIDGE_URL/$JWT_SECRET")
            RESPONSE_BODY=$(cat response.txt)
            if [ "$RESPONSE_BODY" = "success" ]; then
              echo "✅ Setup completed (attempt $attempt)."
              exit 0
            fi
            if [ "$RESPONSE_BODY" = "❌ JWT secret mismatch" ]; then
              echo "❌ JWT secret mismatch — check the JWT_SECRET secret."
              exit 1
            fi
            echo "attempt $attempt: HTTP $HTTP_CODE, response: $(printf '%s' "$RESPONSE_BODY" | head -c 160)"
            sleep 5
          done

          echo "❌ Failed. HTTP: $HTTP_CODE, Response: $(printf '%s' "$RESPONSE_BODY" | head -c 300)"
          exit 1

      - name: 🧹 Remove CI init bridge
        if: always()
        working-directory: ./mail-worker
        run: |
          pnpm wrangler delete -c wrangler-ci-init.build.toml --force \
            || pnpm wrangler delete "${NAME}-ci-init" --force \
            || echo "::warning::init bridge cleanup failed; the next run redeploys the same worker name"
